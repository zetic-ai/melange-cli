# GoReleaser configuration (v2 schema) for the melange CLI.
#
# Local dry run (no publishing, no secrets needed):
#   goreleaser release --snapshot --clean
#
# Repository secrets required for a real (tag-triggered) release:
#   GITHUB_TOKEN      provided automatically by GitHub Actions; needs
#                     `contents: write` to create the GitHub release.
#   TAP_GITHUB_TOKEN  a PAT with push access to zetic-ai/homebrew-tap,
#                     used to publish the Homebrew formula.
version: 2

project_name: melange

builds:
  - id: melange
    main: ./cmd/melange
    binary: melange
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zetic-ai/melange-cli/internal/build.Version={{ .Version }}
      - -X github.com/zetic-ai/melange-cli/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/zetic-ai/melange-cli/internal/build.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# SBOMs are generated with syft (must be on PATH; the release workflow
# installs it via anchore/sbom-action/download-syft).
sboms:
  - artifacts: archive

brews:
  - name: melange
    repository:
      owner: zetic-ai
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://melange.zetic.ai
    description: CLI for Melange, zetic.ai's on-device AI model deployment platform
    license: Apache-2.0
    # auto: never push the formula for snapshots or prereleases.
    skip_upload: auto
    commit_author:
      name: zetic-release-bot
      email: bot@zetic.ai
    test: |
      system "#{bin}/melange", "version"

release:
  draft: false
  # Tags like v1.2.3-rc.1 become GitHub prereleases automatically.
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

snapshot:
  version_template: "{{ incpatch .Version }}-next"
