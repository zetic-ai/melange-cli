# GoReleaser configuration (v2 schema) for the melange CLI.
#
# Local dry run (no publishing, no secrets needed):
#   make snapshot
#
# A real tag-triggered release uses the GitHub-provided GITHUB_TOKEN with
# `contents: write` to create the release. Homebrew publication additionally
# uses HOMEBREW_TAP_GITHUB_TOKEN to update zetic-ai/homebrew-tap.
version: 2

project_name: melange

builds:
  - id: melange
    main: ./cmd/melange
    binary: melange
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zetic-ai/melange-cli/internal/build.Version={{ .Version }}
      - -X github.com/zetic-ai/melange-cli/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/zetic-ai/melange-cli/internal/build.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: melange-qcom
    main: ./cmd/melange-qcom
    binary: melange-qcom
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/zetic-ai/melange-cli/internal/build.Version={{ .Version }}
      - -X github.com/zetic-ai/melange-cli/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/zetic-ai/melange-cli/internal/build.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - melange
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
  - id: qualcomm
    ids:
      - melange-qcom
    name_template: "melange-qcom_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Keyless Sigstore signing authenticates the checksum manifest to the exact
# GitHub Actions workflow/tag identity. The installer verifies this bundle
# before trusting any artifact digest; no long-lived signing key is needed.
signs:
  - id: cosign-checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

# SBOMs are generated with syft (must be on PATH; the release workflow
# installs it via anchore/sbom-action/download-syft).
sboms:
  - artifacts: archive

homebrew_casks:
  - name: melange
    ids:
      - default
    binaries:
      - melange
    directory: Casks
    homepage: https://github.com/zetic-ai/melange-cli
    description: Agent-first command-line interface for ZETIC Melange
    skip_upload: auto
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/melange"]
          end
    repository:
      owner: zetic-ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: zetic-ai-release
      email: dev@zetic.ai

release:
  name_template: "Melange CLI {{ .Tag }}"
  draft: false
  # Tags like v1.2.3-rc.1 become GitHub prereleases automatically.
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

snapshot:
  version_template: "{{ incpatch .Version }}-next"
