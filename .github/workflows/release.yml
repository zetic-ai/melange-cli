# Release pipeline: runs GoReleaser on every pushed v* tag.
#
# Secrets:
#   GITHUB_TOKEN      implicit (provided by Actions); `contents: write`
#                     below lets it create the GitHub release + assets.
#   HOMEBREW_TAP_GITHUB_TOKEN
#                     fine-grained token with contents write access to
#                     zetic-ai/homebrew-tap.
#
# Repository variables:
#   HOMEBREW_PUBLISH_ENABLED=true
#   NPM_PUBLISH_ENABLED=true
#
# npm publication uses trusted publishing for @zetic-ai/melange-cli and the
# GitHub Actions OIDC identity of this workflow.
#
# SBOM generation requires syft on PATH; the download-syft step below
# installs it before GoReleaser runs.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify release source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: "26"

      - name: Build
        run: go build ./...

      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2

      - name: Verify generated client
        if: matrix.os == 'ubuntu-latest'
        run: make gen-check

      - name: Verify generated docs
        if: matrix.os == 'ubuntu-latest'
        run: make docs-check

      - name: Test npm distribution
        if: matrix.os == 'ubuntu-latest'
        run: make npm-test

  release:
    name: publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign identity and npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so GoReleaser can build the changelog.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Install cosign (for keyless checksum signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Run GoReleaser
        if: vars.HOMEBREW_PUBLISH_ENABLED == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          # Pinned minor so release configuration changes are deliberate.
          version: "~> v2.17"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Run GoReleaser without Homebrew publication
        if: vars.HOMEBREW_PUBLISH_ENABLED != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2.17"
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare npm package
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          npm pkg set "version=${version}" --prefix npm
          cp dist/checksums.txt npm/checksums.txt
          cp LICENSE npm/LICENSE
          npm test --prefix npm
          npm pack ./npm --dry-run

      - name: Publish npm package
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          if npm view "@zetic-ai/melange-cli@${version}" version >/dev/null 2>&1; then
            echo "@zetic-ai/melange-cli@${version} is already published."
            exit 0
          fi
          npm publish ./npm --access public --provenance
